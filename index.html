<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f3ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#171614" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Imposter</title>
  <link rel="stylesheet" href="style.css?v=13">
</head>
<body>
  <header>
    <button id="lang-btn" class="lang" aria-label="Language"></button>
    <span id="version" class="version"></span>
    <button id="reset-btn" class="reset" hidden aria-label="Reset">&times;</button>
  </header>

  <!-- Bump ?v= on every release: it makes phones fetch the new files and is
       also the version number shown on the start screen. -->
  <!-- Setup: swipe to choose the number of players -->
  <section id="setup" class="screen">
    <div class="center">
      <div id="picker" class="picker" tabindex="0" aria-label="Number of players"></div>
      <p class="label" data-text="players"></p>
    </div>
    <button id="start-btn" class="primary" data-text="start"></button>
  </section>

  <!-- Turn: one player at a time holds to see their word -->
  <section id="turn" class="screen" hidden>
    <p id="turn-label" class="label"></p>
    <button id="reveal" class="reveal">
      <span class="secret">
        <span id="word"></span>
        <span id="hint" hidden></span>
      </span>
      <span class="eye" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="currentColor"
             stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        <span data-text="hold"></span>
      </span>
    </button>
    <button id="next-btn" class="primary waiting">Next</button>
  </section>

  <!-- Done: everyone has seen their word -->
  <section id="done" class="screen" hidden>
    <div class="center">
      <p id="first-player" class="big"></p>
      <p class="label" data-text="starts"></p>
    </div>
    <button id="again-btn" class="primary" data-text="again"></button>
  </section>

  <script src="words-en.js?v=13"></script>
  <script src="words-da.js?v=13"></script>
  <script src="app.js?v=13"></script>
</body>
</html>
