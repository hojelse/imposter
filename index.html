<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f3ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#171614" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Imposter</title>
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body>
  <header>
    <span class="title">Imposter</span>
    <button id="reset-btn" class="reset" hidden>Reset</button>
  </header>

  <!-- Setup: swipe to choose the number of players -->
  <section id="setup" class="screen">
    <div class="center">
      <p class="label">How many players?</p>
      <div id="picker" class="picker" tabindex="0" aria-label="Number of players"></div>
      <p class="hint">Swipe to change</p>
    </div>
    <button id="start-btn" class="primary">Start</button>
  </section>

  <!-- Turn: one player at a time holds to see their word -->
  <section id="turn" class="screen" hidden>
    <div class="turn-head">
      <p class="label">Pass the phone to</p>
      <p id="turn-label" class="turn-label"></p>
    </div>
    <button id="reveal" class="card">
      <span id="word" hidden></span>
      <span id="reveal-hint">
        <span class="hint-big">Hold to reveal</span>
        <span class="hint-small">Let go to hide</span>
      </span>
    </button>
    <button id="next-btn" class="primary waiting">Next player</button>
  </section>

  <!-- Done: everyone has seen their word -->
  <section id="done" class="screen" hidden>
    <div class="center">
      <p class="turn-label">Everyone has their word</p>
      <p id="first-player" class="first-player"></p>
    </div>
    <button id="again-btn" class="primary">New round</button>
  </section>

  <script src="words.js?v=6"></script>
  <script src="app.js?v=6"></script>
</body>
</html>
